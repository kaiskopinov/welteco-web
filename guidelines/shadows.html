<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong)}*{box-sizing:border-box}a{color:var(--text-accent)}a:hover{color:var(--text-strong)}.lbl{font-size:12px;line-height:16.8px}.mut{opacity:.6}</style></head><body><div style="display:flex;gap:24px"><div style="flex:1;height:96px;border-radius:4px;background:var(--surface-card);border:1px solid var(--border-faint);box-shadow:var(--shadow-card);padding:16px" class="lbl">--shadow-card<br><span class="mut">0 10 12 rgba(247,243,236,.3)</span></div><div style="flex:1;height:96px;border-radius:3px;background:#fff;box-shadow:var(--shadow-badge);padding:16px" class="lbl">--shadow-badge<br><span class="mut">1px ring + 0 1 3 black 10%</span></div><div style="flex:1;height:96px;border-radius:4px;background:var(--accent-secondary);border:1px solid var(--border-subtle);padding:16px" class="lbl">Flat sand<br><span class="mut">fill + 1px #F2F0EB</span></div></div></body></html>
