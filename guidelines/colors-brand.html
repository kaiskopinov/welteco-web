<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong)}*{box-sizing:border-box}a{color:var(--text-accent)}a:hover{color:var(--text-strong)}.lbl{font-size:12px;line-height:16.8px}.mut{opacity:.6}</style></head><body><div style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px"><div><div style="height:80px;border-radius:4px;background:var(--accent);border:1px solid rgba(0,0,0,.06)"></div><div class="lbl" style="margin-top:8px;font-weight:500">--accent</div><div class="lbl mut">#413936</div></div><div><div style="height:80px;border-radius:4px;background:var(--accent-secondary);border:1px solid rgba(0,0,0,.06)"></div><div class="lbl" style="margin-top:8px;font-weight:500">--accent-secondary</div><div class="lbl mut">#F5EFEA</div></div><div><div style="height:80px;border-radius:4px;background:var(--color-base-white);border:1px solid rgba(0,0,0,.06)"></div><div class="lbl" style="margin-top:8px;font-weight:500">--color-base-white</div><div class="lbl mut">#FFFCF7</div></div><div><div style="height:80px;border-radius:4px;background:var(--color-base-black);border:1px solid rgba(0,0,0,.06)"></div><div class="lbl" style="margin-top:8px;font-weight:500">--color-base-black</div><div class="lbl mut">#000000</div></div><div><div style="height:80px;border-radius:4px;background:var(--color-grey-3);border:1px solid rgba(0,0,0,.06)"></div><div class="lbl" style="margin-top:8px;font-weight:500">--color-grey-3</div><div class="lbl mut">#080808</div></div></div></body></html>
