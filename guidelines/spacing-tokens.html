<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong)}*{box-sizing:border-box}a{color:var(--text-accent)}a:hover{color:var(--text-strong)}.lbl{font-size:12px;line-height:16.8px}.mut{opacity:.6}</style></head><body><div style="display:flex;flex-direction:column;gap:6px"><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--space-4</span><span class="lbl mut">4px</span><div style="height:8px;width:12px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--space-6 / grid gap</span><span class="lbl mut">6px</span><div style="height:8px;width:18px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--space-8</span><span class="lbl mut">8px</span><div style="height:8px;width:24px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--space-12</span><span class="lbl mut">12px</span><div style="height:8px;width:36px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--space-16</span><span class="lbl mut">16px</span><div style="height:8px;width:48px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--space-24</span><span class="lbl mut">24px</span><div style="height:8px;width:72px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--space-32</span><span class="lbl mut">32px</span><div style="height:8px;width:96px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--section-pad-sm</span><span class="lbl mut">48px</span><div style="height:8px;width:144px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--section-pad-md</span><span class="lbl mut">96px</span><div style="height:8px;width:288px;max-width:100%;background:var(--accent);border-radius:2px"></div></div><div style="display:grid;grid-template-columns:170px 50px minmax(0,1fr);align-items:center;gap:8px"><span class="lbl">--section-pad-lg</span><span class="lbl mut">144px</span><div style="height:8px;width:432px;max-width:100%;background:var(--accent);border-radius:2px"></div></div></div></body></html>
