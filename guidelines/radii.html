<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Mostly 4px; 6 for icon buttons, 12 for floating pills" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong)}*{box-sizing:border-box}a{color:var(--text-accent)}a:hover{color:var(--text-strong)}.lbl{font-size:12px;line-height:16.8px}.mut{opacity:.6}</style></head><body><div style="display:flex;gap:24px"><div><div style="width:72px;height:72px;border-radius:2px;background:var(--accent-secondary);border:1px solid var(--color-neutral-shade-400)"></div><div class="lbl" style="margin-top:8px">2px</div></div><div><div style="width:72px;height:72px;border-radius:3px;background:var(--accent-secondary);border:1px solid var(--color-neutral-shade-400)"></div><div class="lbl" style="margin-top:8px">3px</div></div><div><div style="width:72px;height:72px;border-radius:4px;background:var(--accent-secondary);border:1px solid var(--color-neutral-shade-400)"></div><div class="lbl" style="margin-top:8px">4px</div></div><div><div style="width:72px;height:72px;border-radius:6px;background:var(--accent-secondary);border:1px solid var(--color-neutral-shade-400)"></div><div class="lbl" style="margin-top:8px">6px</div></div><div><div style="width:72px;height:72px;border-radius:8px;background:var(--accent-secondary);border:1px solid var(--color-neutral-shade-400)"></div><div class="lbl" style="margin-top:8px">8px</div></div><div><div style="width:72px;height:72px;border-radius:12px;background:var(--accent-secondary);border:1px solid var(--color-neutral-shade-400)"></div><div class="lbl" style="margin-top:8px">12px</div></div></div></body></html>
