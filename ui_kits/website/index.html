<!-- @dsCard group="Website" viewport="1440x900" name="Website — Home" subtitle="FormWise construction & architecture homepage, interactive" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website UI kit — Home</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-strong)}*{box-sizing:border-box}a{color:var(--text-accent)}a:hover{color:var(--text-strong)}input::placeholder,textarea::placeholder{color:rgba(0,0,0,.6)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script>window.scrollToId=function(id){var el=document.getElementById(id);if(!el)return;window.scrollTo({top:id==="top"?0:el.getBoundingClientRect().top+window.scrollY-76,behavior:"smooth"});};</script>
</head><body><div id="root"></div>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="HomeTop.jsx"></script>
<script type="text/babel" src="HomeBottom.jsx"></script>
<script type="text/babel">
function App() {
  const [cart, setCart] = React.useState(0);
  const [lightbox, setLightbox] = React.useState(false);
  const buy = () => setCart((c) => c + 1);
  const nav = (id) => id === "buy" ? buy() : window.scrollToId(id);
  return (
    <div>
      <SiteNav cart={cart} onNav={nav} />
      <Hero onWatch={() => setLightbox(true)} />
      <Intro onBuy={buy} />
      <Offer />
      <Services />
      <Process />
      <Projects />
      <About />
      <Values />
      <Blog />
      <Contact />
      <SiteFooter onBuy={buy} />
      <FloatingBadges />
      {lightbox && (
        <div onClick={() => setLightbox(false)} style={{ position: "fixed", inset: 0, zIndex: 50, background: "rgba(0,0,0,0.6)", backdropFilter: "blur(10px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 40, cursor: "zoom-out" }}>
          <div style={{ width: "min(1138px, 100%)", aspectRatio: "16/9", borderRadius: 4, background: `url(${IMG}ae7b1f12f5903495.jpg) 50% 50% / cover no-repeat` }} />
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
