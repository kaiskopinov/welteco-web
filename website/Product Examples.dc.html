<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700&display=swap">
<script src="content.js"></script>
<script src="site-content.js"></script>
<style>body{margin:0;background:#131518}*{box-sizing:border-box}a{color:#FFB869}a:hover{color:#F5F5F5}</style>
</helmet>
<div style="container-type:inline-size;background:#131518;color:#F5F5F5;font-family:'Funnel Sans',-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased">
  <dc-import name="Site Header" active="examples" lang="{{ lang }}" on-lang="{{ setLang }}" hint-size="100%,80px"></dc-import>

  <section style="border-bottom:1px solid rgba(245,245,245,0.08)">
    <div style="max-width:1428px;margin:0 auto;padding:clamp(48px,6cqw,96px) 20px;display:flex;flex-direction:column;gap:24px">
      <span style="align-self:flex-start;padding:8px 12px;border-radius:4px;background:#004394;font-size:14px;line-height:19.6px;letter-spacing:0.2px;text-transform:uppercase">{{ e.kicker }}</span>
      <h1 style="margin:0;max-width:1100px;font-size:clamp(40px,5.6cqw,88px);line-height:0.96;font-weight:500;letter-spacing:-0.02em;text-transform:uppercase;text-wrap:balance">{{ e.h1 }}</h1>
      <p style="margin:0;max-width:680px;font-size:18px;line-height:27px;color:rgba(245,245,245,0.8);text-wrap:pretty">{{ e.sub }}</p>
    </div>
  </section>

  <section style="padding:clamp(48px,5cqw,80px) 0">
    <div style="max-width:1428px;margin:0 auto;padding:0 20px;columns:3 300px;column-gap:16px">
      <sc-for list="{{ photos }}" as="g" hint-placeholder-count="12">
        <button onClick="{{ g.open }}" style="all:unset;cursor:zoom-in;display:block;width:100%;break-inside:avoid;margin:0 0 16px;border-radius:8px;overflow:hidden;background:#1A1D21;min-height:120px">
          <img src="{{ g.src }}" alt="" loading="lazy" onLoad="{{ g.loaded }}" style="display:block;width:100%;height:auto;opacity:0;transition:opacity 1000ms ease-in-out,transform 600ms ease" style-hover="transform:scale(1.03)">
        </button>
      </sc-for>
    </div>
  </section>

  <sc-if value="{{ lbOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" style="position:fixed;inset:0;z-index:50;background:rgba(19,21,24,0.94);display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out">
      <img src="{{ lbSrc }}" alt="" style="max-width:100%;max-height:100%;border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,0.6)">
      <button onClick="{{ close }}" style="all:unset;cursor:pointer;position:absolute;top:20px;right:20px;padding:10px 14px;border-radius:4px;background:#FFB869;color:#131518;font-size:12px;line-height:16.8px;letter-spacing:0.2px;text-transform:uppercase;font-weight:500">{{ e.close }}</button>
    </div>
  </sc-if>

  <dc-import name="Contact Block" lang="{{ lang }}" hint-size="100%,760px"></dc-import>
  <dc-import name="Site Footer" lang="{{ lang }}" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: null, ready: false, lb: null };
  componentDidMount() {
    this.iv = setInterval(() => { if (window.WSITE && window.WCONTENT) { clearInterval(this.iv); this.setState({ ready: true }); } }, 50);
    this.onLang = (e) => this.setState({ lang: e.detail }); window.addEventListener("welteco-lang", this.onLang);
    this.onKey = (e) => { if (e.key === "Escape") this.setState({ lb: null }); }; window.addEventListener("keydown", this.onKey);
  }
  componentWillUnmount() { clearInterval(this.iv); window.removeEventListener("welteco-lang", this.onLang); window.removeEventListener("keydown", this.onKey); }
  renderVals() {
    const S = window.WSITE, C = window.WCONTENT;
    const lang = this.state.lang || (S ? S.getLang() : "ua");
    const base = { lang, setLang: (l) => this.setState({ lang: l }), e: {}, nav: {}, photos: [], lbOpen: !!this.state.lb, lbSrc: this.state.lb || "", close: () => this.setState({ lb: null }) };
    if (!S || !C) return base;
    return { ...base, e: S.T[lang].examples, nav: S.T[lang].nav, photos: C.GALLERY.map((src) => ({ src, loaded: (ev) => { ev.target.style.opacity = 1; }, open: () => this.setState({ lb: src }) })) };
  }
}
</script>
</body>
</html>
