<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@300;400;500;600;700&display=swap">
<script src="content.js"></script>
<script src="site-content.js"></script>
<style>body{margin:0;background:#131518}*{box-sizing:border-box}a{color:#FFB869}a:hover{color:#F5F5F5}</style>
</helmet>
<div style="container-type:inline-size;min-height:100vh;display:flex;flex-direction:column;background:#131518;color:#F5F5F5;font-family:'Funnel Sans',-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased">
  <dc-import name="Site Header" lang="{{ lang }}" on-lang="{{ setLang }}" hint-size="100%,80px"></dc-import>
  <section style="flex:1;display:flex;align-items:center">
    <div style="max-width:1428px;width:100%;margin:0 auto;padding:clamp(64px,8cqw,128px) 20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:6px">
      <div style="position:relative;overflow:hidden;padding:clamp(28px,4cqw,56px);border-radius:4px;background:#1A1D21;border:1px solid rgba(245,245,245,0.08);display:flex;flex-direction:column;gap:24px">
        <div style="position:absolute;left:0;top:0;width:100%;height:3px;background:#FFB869"></div>
        <div style="position:absolute;top:0;left:0;width:75%;height:80%;pointer-events:none;background-image:linear-gradient(rgba(255,184,105,0.2) 1px,transparent 1px),linear-gradient(90deg,rgba(255,184,105,0.2) 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:radial-gradient(circle at 0% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(circle at 0% 0%,#000 0%,transparent 70%)"></div>
        <h1 style="position:relative;margin:0;font-size:clamp(36px,4.6cqw,72px);line-height:0.98;font-weight:500;letter-spacing:-0.02em;text-transform:uppercase;text-wrap:balance">{{ u.h1 }}</h1>
        <sc-for list="{{ u.p }}" as="p" hint-placeholder-count="2"><p style="position:relative;margin:0;max-width:600px;font-size:17px;line-height:26px;color:rgba(245,245,245,0.78);text-wrap:pretty">{{ p }}</p></sc-for>
        <div style="position:relative"><a href="Home B Amber.dc.html" style="display:inline-flex;align-items:center;gap:12px;padding:14px 20px;border-radius:4px;background:#FFB869;color:#131518;font-size:16px;line-height:24px;font-weight:500;letter-spacing:0.2px;text-transform:uppercase;text-decoration:none;transition:opacity 200ms ease" style-hover="opacity:0.85">{{ nav.home }}<span style="font-size:18px;line-height:1">→</span></a></div>
      </div>
      <div style="padding:clamp(28px,4cqw,56px);border-radius:4px;background:#004394;display:flex;flex-direction:column;justify-content:space-between;gap:32px">
        <div style="display:flex;flex-direction:column;gap:12px">
          <h2 style="margin:0;font-size:clamp(24px,2.4cqw,34px);line-height:1.1;font-weight:500;text-transform:uppercase">{{ u.helpTitle }}</h2>
          <p style="margin:0;font-size:16px;line-height:25px;color:rgba(245,245,245,0.85);text-wrap:pretty">{{ u.helpText }}</p>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;padding-top:20px;border-top:1px solid rgba(245,245,245,0.25)">
          <a href="tel:+380674871637" style="color:#F5F5F5;text-decoration:none;font-size:clamp(22px,2cqw,30px);line-height:1.15;font-weight:500">+38 067 487 16 37</a>
          <a href="tel:+380986660386" style="color:#F5F5F5;text-decoration:none;font-size:clamp(22px,2cqw,30px);line-height:1.15;font-weight:500">+38 098 666 03 86</a>
          <a href="mailto:office@welteco.com" style="color:#FFB869;text-decoration:none;font-size:18px;line-height:26px">office@welteco.com</a>
        </div>
      </div>
    </div>
  </section>
  <dc-import name="Site Footer" lang="{{ lang }}" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { lang: null, ready: false };
  componentDidMount() {
    this.iv = setInterval(() => { if (window.WSITE && window.WCONTENT) { clearInterval(this.iv); this.setState({ ready: true }); } }, 50);
    this.onLang = (e) => this.setState({ lang: e.detail }); window.addEventListener("welteco-lang", this.onLang);
  }
  componentWillUnmount() { clearInterval(this.iv); window.removeEventListener("welteco-lang", this.onLang); }
  renderVals() {
    const S = window.WSITE, C = window.WCONTENT; const lang = this.state.lang || (S ? S.getLang() : "ua");
    return { lang, setLang: (l) => this.setState({ lang: l }), u: C ? C[lang].update : { p: [] }, nav: S ? S.T[lang].nav : {} };
  }
}
</script>
</body>
</html>
